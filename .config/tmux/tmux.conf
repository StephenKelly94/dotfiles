set -g mouse on
set -g default-terminal "tmux-256color"
# Advertise 24-bit color so truecolor reaches nvim inside tmux
set -ga terminal-features "xterm-ghostty:RGB"
# Forward extended keys (CSI-u) so apps see <C-i>≠<Tab>, <C-m>≠<Enter>, <M-…>, etc.
set -s extended-keys always
set -as terminal-features "xterm-ghostty:extkeys"

unbind C-b
set -g prefix C-a

unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Move between panes; if the pane was zoomed, re-zoom after moving
bind -r h if -F '#{window_zoomed_flag}' 'select-pane -L ; resize-pane -Z' { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind -r j if -F '#{window_zoomed_flag}' 'select-pane -D ; resize-pane -Z' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind -r k if -F '#{window_zoomed_flag}' 'select-pane -U ; resize-pane -Z' { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind -r l if -F '#{window_zoomed_flag}' 'select-pane -R ; resize-pane -Z' { if -F '#{pane_at_right}'  '' 'select-pane -R' }

bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
bind -r C-h resize-pane -L 5

# vi keys in copy-mode; y yanks to tmux buffer + macOS clipboard
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi Escape send -X cancel

# Floating popups, opened in the current pane's directory (-E closes on exit)
bind g     display-popup -E -d '#{pane_current_path}' -w 90% -h 90% 'lazygit'
bind Enter display-popup -E -d '#{pane_current_path}' -w 80% -h 80%

# Fix xterm home and end
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# tmux is launched directly by ghostty (no parent shell), so suspend-client has
# nothing to fg back into — it strands the client. Drop the default binding.
unbind-key C-z

# Native tmux session tree (moved off lowercase s, which now opens sesh)
bind-key "S" choose-tree -Zs

# Jump to last sesh session
bind-key "b" run-shell "sesh last"

# Sesh (primary session switcher)
bind-key C-s run-shell "sesh connect \"$(
  sesh list --icons -d | fzf --tmux 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons -d)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute-silent([ {2..} != \"#{session_name}\" ] && tmux kill-session -t {2..} 2>/dev/null)+change-prompt(⚡  )+reload(sesh list --icons -d)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Install plugins under XDG instead of ~/.tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @catppuccin_flavor 'frappe' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"

run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# Dim inactive panes using the active theme palette (set by catppuccin above)
set -g window-style 'fg=#{@thm_overlay_0},bg=#{@thm_crust}'
set -g window-active-style 'fg=terminal,bg=terminal'

# Pane borders (tmux has no dotted; simple uses ASCII + | -)
set -g pane-border-lines simple


set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF  status-right "#{@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
